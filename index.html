<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827">
<title>Catatan Keuangan V4</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b1220;--panel:#121d2e;--panel2:#18263a;--line:#26364c;--text:#edf4ff;--muted:#91a4bd;--green:#36c98f;--red:#ff7185;--blue:#6ea8ff;--gold:#f6c66a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:16px 14px 96px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.brand{font-size:20px;font-weight:800}.sub{color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 10px;color:var(--muted);background:var(--panel)}.hero{background:linear-gradient(135deg,#193455,#17243a);border:1px solid #2c4b6d;border-radius:20px;padding:18px;margin-bottom:14px}.hero small{color:#b6c9df}.balance{font-size:29px;font-weight:850;margin:7px 0 14px;letter-spacing:-.7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:16px;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menu{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--text)}.ico{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:var(--panel2);font-size:18px}.menu strong{display:block;font-size:13px}.menu small{color:var(--muted);font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:8px}.item{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:13px}.item .name{font-weight:650}.item .meta{font-size:12px;color:var(--muted);margin-top:3px}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:#07111f;font-weight:750}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#512532;color:#ffdce2}.btn.small{padding:7px 10px;font-size:12px}.form{display:grid;gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;background:#0d1726;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.page-title{font-size:22px;font-weight:800;margin:6px 0 14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0c1523f2;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{background:none;border:0;color:var(--muted);padding:7px 2px;border-radius:10px;font-size:10px}.nav button.active{background:var(--panel2);color:var(--text)}.nav span{display:block;font-size:18px;margin-bottom:2px}.bar{height:8px;background:#26364c;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green)}.notice{padding:11px 12px;border:1px solid #6a5428;background:#302817;color:#f9dfaa;border-radius:12px;font-size:12px;margin-bottom:12px}.empty{text-align:center;padding:26px 12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;background:#0d1726;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted)}
</style></head><body><main class="app"><header class="top"><div><div class="brand">◈ Catatan Keuangan</div><div class="sub">Versi 4 · Data tersimpan di perangkat ini</div></div><button class="pill" id="soundBtn">🔊 Suara ON</button></header><div id="view"></div></main>
<nav class="bottom"><div class="nav"><button data-page="dashboard" class="active"><span>⌂</span>Beranda</button><button data-page="transactions"><span>⇄</span>Transaksi</button><button data-page="accounts"><span>▣</span>Rekening</button><button data-page="networth"><span>◈</span>Neraca</button><button data-page="more"><span>☰</span>Lainnya</button></div></nav>
<input id="xlsxFile" type="file" accept=".xlsx,.xls" class="hidden">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(()=>{'use strict';
const KEY='ckp_v4_stage1_data',SET='ckp_v4_stage1_settings';
const defaultData={accounts:[],categories:[{name:'Gaji',type:'Pemasukan',group:'Pendapatan Aktif'},{name:'Bonus',type:'Pemasukan',group:'Pendapatan Pasif'},{name:'Pendapatan Lain',type:'Pemasukan',group:'Lainnya'},{name:'Makan & Minum',type:'Pengeluaran',group:'Kebutuhan Pokok'},{name:'Transportasi',type:'Pengeluaran',group:'Transportasi & Perawatan'},{name:'Belanja Bulanan',type:'Pengeluaran',group:'Kebutuhan Pokok'},{name:'Hiburan',type:'Pengeluaran',group:'Gaya Hidup'},{name:'Tagihan & Utilitas',type:'Pengeluaran',group:'Tagihan'},{name:'Lainnya',type:'Pengeluaran',group:'Lainnya'}],transactions:[],budgets:[]};
let data=load(),settings=JSON.parse(localStorage.getItem(SET)||'{"sound":true,"volume":0.45}'),page='dashboard',editing=null,filterText='';
function load(){try{return {...structuredClone(defaultData),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaultData)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateNow(){return new Date().toISOString().slice(0,10)}
function fx(type){if(!settings.sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);let f={click:480,success:760,income:880,expense:360,transfer:620,delete:240,error:170}[type]||480;o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(settings.volume*.12,c.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.13);o.start();o.stop(c.currentTime+.14);setTimeout(()=>c.close(),250)}catch(e){}}
function totals(){let inc=0,out=0;data.transactions.forEach(t=>{if(t.type==='Pemasukan')inc+=+t.amount;if(t.type==='Pengeluaran')out+=+t.amount});return{inc,out,balance:data.accounts.reduce((s,a)=>s+accountBalance(a.name),0)}}
function accountBalance(name){let a=data.accounts.find(x=>x.name===name);if(!a)return 0;let n=+a.opening||0;data.transactions.forEach(t=>{if(t.account===name){if(t.type==='Pemasukan')n+=+t.amount;else if(t.type==='Pengeluaran')n-=+t.amount;else if(t.type==='Transfer')n-=+t.amount}if(t.type==='Transfer'&&t.to===name)n+=+t.amount});return n}
function monthTransactions(){let m=new Date().toISOString().slice(0,7);return data.transactions.filter(t=>(t.date||'').slice(0,7)===m)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let v=document.getElementById('view');({dashboard:dash,transactions:transactions,accounts:accounts,networth:networth,more:more}[page]||dash)(v)}
function dash(v){let t=totals(),mt=monthTransactions(),mi=mt.filter(x=>x.type==='Pemasukan').reduce((s,x)=>s+ +x.amount,0),mo=mt.filter(x=>x.type==='Pengeluaran').reduce((s,x)=>s+ +x.amount,0);v.innerHTML=`<section class="hero"><small>Saldo seluruh rekening saat ini</small><div class="balance">${money(t.balance)}</div><div class="stats"><div><small>↑ Pemasukan bulan ini</small><b class="green">${money(mi)}</b></div><div><small>↓ Pengeluaran bulan ini</small><b class="red">${money(mo)}</b></div></div></section><div class="section"><h2>Menu utama</h2><span class="sub">Tahap 1</span></div><div class="grid"><button class="menu" data-go="networth"><span class="ico">◈</span><span><strong>Neraca Kekayaan</strong><small>Ringkasan aset rekening</small></span></button><button class="menu" data-go="accounts"><span class="ico">▣</span><span><strong>Rekening</strong><small>Saldo & rekening</small></span></button><button class="menu" data-go="categories"><span class="ico">▤</span><span><strong>Kategori</strong><small>Atur kategori</small></span></button><button class="menu" data-go="transactions"><span class="ico">⇄</span><span><strong>Transaksi</strong><small>Catat pemasukan & biaya</small></span></button></div><div class="section"><h2>Transaksi terbaru</h2><button class="btn small secondary" data-go="transactions">Lihat semua</button></div>${transactionList(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}`}
function transactionList(arr){if(!arr.length)return '<div class="card empty">Belum ada transaksi. Tambahkan transaksi pertamamu.</div>';return `<div class="list">${arr.map(t=>`<div class="item"><div class="row"><div><div class="name">${esc(t.note||t.category||t.type)}</div><div class="meta">${esc(t.date)} · ${esc(t.account)}${t.type==='Transfer'?' → '+esc(t.to):' · '+esc(t.category||t.type)}</div></div><b class="${t.type==='Pemasukan'?'green':t.type==='Pengeluaran'?'red':''}">${t.type==='Pemasukan'?'+':t.type==='Pengeluaran'?'-':''}${money(t.amount)}</b></div></div>`).join('')}</div>`}
function transactions(v){v.innerHTML=`<div class="page-title">Transaksi</div><div class="toolbar"><button class="btn" id="addTx">＋ Tambah transaksi</button><button class="btn secondary" id="searchToggle">⌕ Cari</button></div><div id="searchBox" class="hidden" style="margin-top:10px"><input class="search" id="txSearch" placeholder="Cari keterangan, kategori, rekening..."></div><div class="section"><h2>Riwayat transaksi</h2><span class="sub">${data.transactions.length} catatan</span></div><div id="txList">${transactionList(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div>`;document.getElementById('addTx').onclick=()=>txForm();document.getElementById('searchToggle').onclick=()=>document.getElementById('searchBox').classList.toggle('hidden');document.getElementById('txSearch').oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById('txList').innerHTML=transactionList(data.transactions.filter(t=>[t.note,t.category,t.account,t.to,t.type].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)))} }
function accounts(v){v.innerHTML=`<div class="page-title">Rekening</div><div class="toolbar"><button class="btn" id="addAcc">＋ Tambah rekening</button></div><div class="section"><h2>Daftar rekening</h2><span class="sub">${data.accounts.length} rekening</span></div>${data.accounts.length?`<div class="list">${data.accounts.map(a=>`<div class="item"><div class="row"><div><div class="name">${esc(a.name)}</div><div class="meta">${esc(a.kind||'Lainnya')} · Saldo awal ${money(a.opening)}</div></div><b>${money(accountBalance(a.name))}</b></div><div class="row" style="margin-top:10px"><span class="meta">${esc(a.number||'')}</span><button class="btn small secondary" data-editacc="${esc(a.id)}">Ubah</button></div></div>`).join('')}</div>`:'<div class="card empty">Belum ada rekening. Tambahkan rekening terlebih dahulu.</div>'}`;document.getElementById('addAcc').onclick=()=>accountForm();v.querySelectorAll('[data-editacc]').forEach(b=>b.onclick=()=>accountForm(b.dataset.editacc))}
function networth(v){let total=totals().balance;v.innerHTML=`<div class="page-title">Neraca Kekayaan</div><div class="hero"><small>Total aset rekening saat ini</small><div class="balance">${money(total)}</div><small>Perkiraan kekayaan bersih tahap 1</small></div><div class="notice">Tahap ini menghitung saldo rekening. Investasi, aset tetap, tabungan, piutang, dan utang akan dihubungkan pada tahap lanjutan agar neraca lengkap.</div><div class="section"><h2>Rincian rekening</h2></div>${data.accounts.length?`<div class="list">${data.accounts.map(a=>`<div class="item row"><span>${esc(a.name)}</span><b>${money(accountBalance(a.name))}</b></div>`).join('')}</div>`:'<div class="card empty">Tambahkan rekening untuk mulai menghitung neraca.</div>'}`}
function more(v){v.innerHTML=`<div class="page-title">Lainnya</div><div class="grid"><button class="menu" data-go="categories"><span class="ico">▤</span><span><strong>Kategori</strong><small>Kelola kategori</small></span></button><button class="menu" id="importX"><span class="ico">⇧</span><span><strong>Impor Excel</strong><small>Ambil data dari workbook</small></span></button><button class="menu" id="exportJson"><span class="ico">⇩</span><span><strong>Cadangkan data</strong><small>Unduh salinan JSON</small></span></button><button class="menu" id="restoreJson"><span class="ico">↻</span><span><strong>Pulihkan data</strong><small>Impor cadangan JSON</small></span></button><button class="menu" id="soundSettings"><span class="ico">♫</span><span><strong>Pengaturan suara</strong><small>Suara klik & aktivitas</small></span></button></div><div class="section"><h2>Keamanan data</h2></div><div class="card muted" style="font-size:12px">Data tersimpan di penyimpanan browser perangkat ini. Jangan hapus data browser sebelum membuat cadangan. Jangan masukkan data pribadi ke repository GitHub.</div><input id="jsonFile" type="file" accept=".json" class="hidden">`;document.getElementById('importX').onclick=()=>document.getElementById('xlsxFile').click();document.getElementById('exportJson').onclick=backup;document.getElementById('restoreJson').onclick=()=>document.getElementById('jsonFile').click();document.getElementById('jsonFile').onchange=restore;document.getElementById('soundSettings').onclick=()=>{settings.sound=!settings.sound;localStorage.setItem(SET,JSON.stringify(settings));soundButton();alert('Suara '+(settings.sound?'diaktifkan':'dimatikan'));fx('click')}}
function categories(v){v.innerHTML=`<div class="row"><div class="page-title">Kategori</div><button class="btn" id="addCat">＋ Tambah</button></div><div class="section"><h2>Pemasukan</h2></div>${catList('Pemasukan')}<div class="section"><h2>Pengeluaran</h2></div>${catList('Pengeluaran')}`;document.getElementById('addCat').onclick=()=>catForm()}
function catList(type){let a=data.categories.filter(c=>c.type===type);return a.length?`<div class="list">${a.map(c=>`<div class="item row"><div><b>${esc(c.name)}</b><div class="meta">${esc(c.group||type)}</div></div><button class="btn small secondary" data-cat="${esc(c.name)}">Hapus</button></div>`).join('')}</div>`:'<div class="card empty">Belum ada kategori.</div>'}
function accountForm(id){let a=data.accounts.find(x=>x.id===id)||{};modal('Rekening',`<div class="form"><div class="field"><label>Nama rekening</label><input id="fName" value="${esc(a.name||'')}" required></div><div class="field"><label>Jenis rekening</label><select id="fKind"><option>Bank</option><option>Tunai</option><option>E-Wallet</option><option>Lainnya</option></select></div><div class="field"><label>Nomor rekening / HP (opsional)</label><input id="fNumber" value="${esc(a.number||'')}"></div><div class="field"><label>Saldo awal</label><input id="fOpening" type="number" min="0" value="${Number(a.opening)||0}"></div><button class="btn" id="saveAcc">Simpan rekening</button></div>`);document.getElementById('fKind').value=a.kind||'Bank';document.getElementById('saveAcc').onclick=()=>{let name=document.getElementById('fName').value.trim();if(!name)return alert('Nama rekening wajib diisi');let obj={id:a.id||crypto.randomUUID(),name,kind:document.getElementById('fKind').value,number:document.getElementById('fNumber').value.trim(),opening:+document.getElementById('fOpening').value||0};if(id){let old=data.accounts.findIndex(x=>x.id===id);data.accounts[old]=obj}else data.accounts.push(obj);save();closeModal();fx('success');render()}}
function txForm(){if(!data.accounts.length){alert('Tambahkan rekening dulu sebelum mencatat transaksi.');page='accounts';render();return}let opts=data.accounts.map(a=>`<option>${esc(a.name)}</option>`).join('');modal('Tambah transaksi',`<div class="form"><div class="two"><div class="field"><label>Tanggal</label><input id="tDate" type="date" value="${dateNow()}"></div><div class="field"><label>Jenis transaksi</label><select id="tType"><option>Pemasukan</option><option>Pengeluaran</option><option>Transfer</option></select></div></div><div class="field"><label>Rekening asal</label><select id="tAccount">${opts}</select></div><div class="field hidden" id="toWrap"><label>Rekening tujuan</label><select id="tTo">${opts}</select></div><div class="field" id="catWrap"><label>Kategori</label><select id="tCat"></select></div><div class="field"><label>Keterangan</label><input id="tNote" placeholder="Contoh: belanja harian"></div><div class="field"><label>Jumlah (Rp)</label><input id="tAmount" type="number" min="1" inputmode="numeric" placeholder="0"></div><button class="btn" id="saveTx">Simpan transaksi</button></div>`);let type=document.getElementById('tType');function sync(){let tr=type.value==='Transfer';document.getElementById('toWrap').classList.toggle('hidden',!tr);document.getElementById('catWrap').classList.toggle('hidden',tr);let cats=data.categories.filter(c=>c.type===type.value);document.getElementById('tCat').innerHTML=cats.map(c=>`<option>${esc(c.name)}</option>`).join('')}type.onchange=sync;sync();document.getElementById('saveTx').onclick=()=>{let amount=+document.getElementById('tAmount').value,account=document.getElementById('tAccount').value,to=document.getElementById('tTo').value;if(!amount||amount<=0)return alert('Masukkan jumlah lebih dari nol');if(type.value==='Transfer'&&account===to)return alert('Rekening asal dan tujuan tidak boleh sama');let t={id:crypto.randomUUID(),date:document.getElementById('tDate').value,type:type.value,account,to:type.value==='Transfer'?to:'',category:type.value==='Transfer'?'Transfer Antar Rekening':document.getElementById('tCat').value,note:document.getElementById('tNote').value.trim(),amount};data.transactions.push(t);save();closeModal();fx(type.value==='Pemasukan'?'income':type.value==='Pengeluaran'?'expense':'transfer');render()}}
function catForm(){modal('Tambah kategori',`<div class="form"><div class="field"><label>Nama kategori</label><input id="cName"></div><div class="field"><label>Jenis</label><select id="cType"><option>Pemasukan</option><option>Pengeluaran</option></select></div><div class="field"><label>Kelompok (opsional)</label><input id="cGroup"></div><button class="btn" id="saveCat">Simpan kategori</button></div>`);document.getElementById('saveCat').onclick=()=>{let name=document.getElementById('cName').value.trim(),type=document.getElementById('cType').value;if(!name)return alert('Nama kategori wajib diisi');if(data.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.type===type))return alert('Kategori sudah ada');data.categories.push({name,type,group:document.getElementById('cGroup').value.trim()});save();closeModal();render()}}
function modal(title,body){let old=document.getElementById('modal');if(old)old.remove();let d=document.createElement('div');d.id='modal';d.style='position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:12px';d.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 14px 14px;padding:18px;width:min(620px,100%);max-height:90vh;overflow:auto"><div class="row" style="margin-bottom:14px"><b style="font-size:18px">${title}</b><button class="btn small secondary" id="closeModal">Tutup</button></div>${body}</div>`;document.body.append(d);document.getElementById('closeModal').onclick=closeModal}function closeModal(){document.getElementById('modal')?.remove()}
function backup(){let b=new Blob([JSON.stringify({data,settings,version:4},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cadangan-catatan-keuangan.json';a.click();URL.revokeObjectURL(a.href);fx('success')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data?.accounts||!x.data?.transactions)throw Error();if(confirm('Pulihkan cadangan? Data saat ini akan diganti.')){data=x.data;save();render();alert('Cadangan berhasil dipulihkan')}}catch(err){alert('File cadangan tidak valid')}};r.readAsText(f)}
function importExcel(e){let f=e.target.files[0];if(!f)return;if(!window.XLSX){alert('Pustaka Excel belum termuat. Pastikan internet aktif, lalu coba lagi.');return}let r=new FileReader();r.onload=ev=>{try{let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});let get=(name)=>wb.Sheets[name]?XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null}):[];let ar=get('Rekening'),ac=[];for(let i=1;i<ar.length;i++){let row=ar[i];if(row[1])ac.push({id:crypto.randomUUID(),name:String(row[1]),kind:String(row[2]||'Lainnya'),number:String(row[3]||''),opening:Number(row[4])||0})}let cr=get('Kategori'),cats=[];for(let i=1;i<cr.length;i++)if(cr[i][0]&&cr[i][1])cats.push({name:String(cr[i][0]),type:String(cr[i][1]),group:String(cr[i][2]||'')});let tr=get('Transaksi'),tx=[];for(let i=1;i<tr.length;i++){let x=tr[i];if(!x[1]||!x[2]||!x[3]||!x[7])continue;let dt=x[1] instanceof Date?x[1].toISOString().slice(0,10):String(x[1]).slice(0,10);tx.push({id:crypto.randomUUID(),date:dt,account:String(x[2]),type:String(x[3]),to:x[4]?String(x[4]):'',category:x[5]?String(x[5]):'',note:x[6]?String(x[6]):'',amount:Number(x[7])||0,ref:x[10]?String(x[10]):''})}if(!ac.length&&!tx.length)throw Error('Tidak menemukan data rekening atau transaksi');if(confirm(`Ditemukan ${ac.length} rekening, ${cats.length} kategori, dan ${tx.length} transaksi. Ganti data aplikasi saat ini dengan data Excel?`)){data.accounts=ac;data.categories=cats.length?cats:defaultData.categories;data.transactions=tx;save();render();alert('Impor tahap 1 selesai. Periksa saldo dan transaksi sebelum digunakan.')} }catch(err){alert('Gagal membaca Excel: '+err.message)} };r.readAsArrayBuffer(f)}
function soundButton(){let b=document.getElementById('soundBtn');b.textContent=settings.sound?'🔊 Suara ON':'🔇 Suara OFF'}
document.getElementById('soundBtn').onclick=()=>{settings.sound=!settings.sound;localStorage.setItem(SET,JSON.stringify(settings));soundButton();fx('click')};document.getElementById('xlsxFile').onchange=importExcel;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;fx('click');render()});document.getElementById('view').addEventListener('click',e=>{let go=e.target.closest('[data-go]');if(go){page=go.dataset.go;render()}let del=e.target.closest('[data-cat]');if(del&&confirm('Hapus kategori ini?')){data.categories=data.categories.filter(c=>c.name!==del.dataset.cat);save();render()}});
// kategori screen reachable from dashboard menu; support browser history-free navigation
const oldRender=render;render=function(){oldRender();if(page==='categories')categories(document.getElementById('view'));document.getElementById('view').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.getElementById('view').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{if(confirm('Hapus kategori ini?')){data.categories=data.categories.filter(c=>c.name!==b.dataset.cat);save();render()}})};
soundButton();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});render();
})();
</script></body></html>
